<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concept Car Slides</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="accordion-card">
      <div class="slide slide-jaguar">
        <span class="slide-label">Jaguar Type 00</span>
        <button class="kabak-btn">View Car</button>
      </div>

      <div class="slide slide-lancia">
        <span class="slide-label">Lancia Stratos Zero</span>
        <button class="kabak-btn">View Car</button>
      </div>

      <div class="slide slide-porsche">
        <span class="slide-label">Porsche 918</span>
        <button class="kabak-btn">View Car</button>
      </div>

      <div class="slide slide-aston">
        <span class="slide-label">Aston Martin Atom</span>
        <button class="kabak-btn">View Car</button>
      </div>

      <div class="slide slide-bmw">
        <span class="slide-label">BMW GINA</span>
        <button class="kabak-btn">View Car</button>
      </div>
    </div>
  </body>
</html>
